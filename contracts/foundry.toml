[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# tests mint all 5,000 NFTs in one go
gas_limit = "18446744073709551615"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[lint]
exclude_lints = ["mixed-case-variable", "mixed-case-function"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 10000
