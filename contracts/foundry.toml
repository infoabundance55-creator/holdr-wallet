[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# compiler picked per file from its pragma: 0.8.28 for Holdr, 0.8.26 for Uniswap v4-core
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# tests mint all 5,000 NFTs in one go
gas_limit = "18446744073709551615"
# tests and the testnet script deploy the real Uniswap PoolManager from its build artifact;
# the testnet script writes deployed addresses to deployments/
fs_permissions = [{ access = "read", path = "./out" }, { access = "read-write", path = "./deployments" }]
# only the remappings below (CI checks out nested submodules that would add others)
auto_detect_remappings = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "@uniswap/v4-core/=lib/v4-core/",
  "solmate/=lib/v4-core/lib/solmate/",
]

[lint]
exclude_lints = ["mixed-case-variable", "mixed-case-function"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[profile.ci.fuzz]
runs = 10000
